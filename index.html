<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0c2118">
    <title>Footcore Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=development-23">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#dashboard" aria-label="Footcore Manager">
          <span class="brand-mark">FC</span>
          <span><strong>FOOTCORE</strong><small>MANAGER</small></span>
        </a>
        <nav class="nav" aria-label="Navegação principal">
          <button class="nav-item active" data-view="dashboard"><span>⌂</span> Central</button>
          <button class="nav-item mail-nav" data-view="mail"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m4 7 8 6 8-6"></path></svg></span> Correio<b id="mail-badge" hidden>0</b></button>
          <button class="nav-item" data-view="squad"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"></circle><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"></path><path d="M15 5.5a3 3 0 0 1 0 5.5M16.5 14c2.5.5 4 2.2 4 5"></path></svg></span> Elenco</button>
          <button class="nav-item" data-view="lineup"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M12 4v16M3 12h4M17 12h4"></path><circle cx="8" cy="9" r="1.4"></circle><circle cx="16" cy="15" r="1.4"></circle></svg></span> Escalação</button>
          <button class="nav-item" data-view="academy"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-9"></path><path d="M12 12C7.5 12 5 9.5 5 5c4.5 0 7 2.5 7 7ZM12 15c0-4.5 2.5-7 7-7 0 4.5-2.5 7-7 7Z"></path></svg></span> Base</button>
          <button class="nav-item" data-view="market"><span>⇄</span> Mercado</button>
          <button class="nav-item" data-view="competition"><span>▥</span> Campeonato</button>
          <button class="nav-item" data-view="stadium"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M5 20v-8l7-5 7 5v8M8 20v-5h8v5M5 12h14"></path></svg></span> Estádio</button>
        </nav>
        <div class="sidebar-footer">
          <button id="new-game-button" class="text-button">Novo jogo</button>
          <p>Salvamento automático</p>
          <span class="save-state"><i></i> Progresso salvo</span>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="mobile-brand"><span class="brand-mark">FC</span></div>
          <div id="club-identity" class="club-identity"></div>
          <div class="top-stats">
            <div><small>Temporada</small><strong id="season-label">1</strong></div>
            <div><small>Rodada</small><strong id="week-label">1/14</strong></div>
            <div><small>Caixa</small><strong id="budget-label">R$ 0</strong></div>
          </div>
          <button id="advance-button" class="primary-button">Jogar rodada <span>→</span></button>
        </header>

        <div id="content" class="content"></div>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <dialog id="penalty-dialog" aria-labelledby="penalty-title" aria-describedby="penalty-description"></dialog>
    <dialog id="offer-dialog" aria-labelledby="offer-title"></dialog>
    <script type="importmap">
{
  "imports": {
    "./src/career-repository.js": "./src/career-repository.js?v=development-2",
    "./src/career-setup.js": "./src/career-setup.js?v=development-4",
    "./src/career-storage.js": "./src/career-storage.js?v=development-1",
    "./src/club-badge.js": "./src/club-badge.js?v=development-1",
    "./src/player-balance.js": "./src/player-balance.js?v=development-5",
    "./src/player-impact.js": "./src/player-impact.js?v=development-1",
    "./src/marking.js": "./src/marking.js?v=development-1",
    "./src/season-tracking.js": "./src/season-tracking.js?v=development-1",
    "./src/market-filters.js": "./src/market-filters.js?v=development-1",
    "./src/lineup.js": "./src/lineup.js?v=development-5",
    "./src/lineup-view.js": "./src/lineup-view.js?v=development-8",
    "./src/contracts.js": "./src/contracts.js?v=development-3",
    "./src/core.js": "./src/core.js?v=development-23",
    "./src/youth-academy.js": "./src/youth-academy.js?v=development-8",
    "./src/database.js": "./src/database.js?v=development-2",
    "./src/html.js": "./src/html.js?v=development-1",
    "./src/team-shirt.js": "./src/team-shirt.js?v=development-1",
    "./src/match-view.js": "./src/match-view.js?v=development-6",
    "./src/match.js": "./src/match.js?v=development-6",
    "./src/penalty-view.js": "./src/penalty-view.js?v=development-1",
    "./src/development.js": "./src/development.js?v=development-4",
    "./src/ratings.js": "./src/ratings.js?v=development-3",
    "./src/round-view.js": "./src/round-view.js?v=development-3",
    "./src/tactics.js": "./src/tactics.js?v=development-2"
  }
}
    </script>
    <script type="module" src="src/app.js?v=development-40"></script>
  </body>
</html>
